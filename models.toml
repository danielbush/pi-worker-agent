# Which model each agent name means.
#
# Edit this file to change your defaults. It is the only configuration
# prime-worker has. The manager reads it at the start of a session.
#
# Each alias names its default harness, then has one block per harness it can
# run on. A harness with no block means the alias is not available there.
#
#   [aliases.<name>]            harness = the block to use unless you say otherwise
#   [aliases.<name>.<harness>]  model     = exact model name for THAT harness
#                               reasoning = effort level
#                               fast      = alternate model for the fast tier
#
# Find exact native selectors with:   prime-agent model list <search>
# Find exact cursor model names with: cursor-agent --list-models
#
# Reasoning levels, native: off, minimal, low, medium, high, xhigh, max
# Roles the manager recognises:  plan, implement, investigate, review
#
# Cursor has no separate effort flag — the level and the fast tier are both part
# of the model name — so `reasoning` in a cursor block only records the intent.


[aliases.grok]
harness = "cursor"

[aliases.grok.cursor]
model     = "cursor-grok-4.6-high"
reasoning = "high"
fast      = "cursor-grok-4.6-high-fast"

[aliases.grok.native]
model     = "openrouter/x-ai/grok-4.6"
reasoning = "high"


[aliases.sol]
harness = "codex"

[aliases.sol.codex]
model     = "gpt-5.6-sol"
reasoning = "medium"

[aliases.sol.native]
model     = "openai-codex/gpt-5.6-sol"
reasoning = "medium"

[aliases.sol.cursor]
model     = "gpt-5.6-sol-medium"
reasoning = "medium"
fast      = "gpt-5.6-sol-medium-fast"


[aliases.opus]
harness = "claude-code"

[aliases.opus.claude-code]
model     = "claude-opus-5"
reasoning = "high"

[aliases.opus.cursor]
model     = "claude-opus-5-thinking-high"
reasoning = "high"
fast      = "claude-opus-5-thinking-high-fast"

[aliases.opus.native]
model     = "openrouter/anthropic/claude-opus-5"
reasoning = "high"



# Native-only aliases, via the openrouter-routed provider configured in
# ~/.prime/agent/models.json.

[aliases.kimi]
harness = "native"

[aliases.kimi.native]
model     = "openrouter-routed/moonshotai/kimi-k3"
reasoning = "high"


[aliases.deeppro]
harness = "native"

[aliases.deeppro.native]
model     = "openrouter-routed/deepseek/deepseek-v4-pro-0813"
reasoning = "high"


[aliases.deepflash]
harness = "native"

[aliases.deepflash.native]
model     = "openrouter-routed/deepseek/deepseek-v4-flash-0731"
reasoning = "high"


[aliases.glm]
harness = "native"

[aliases.glm.native]
model     = "openrouter-routed/z-ai/glm-5.3-flash"
reasoning = "high"


# Per-role overrides are optional, and sit under the harness they apply to.
# Anything not listed uses that harness block's own values. For example, to make
# sol think harder when reviewing on codex:
#
# [aliases.sol.codex.roles]
# review = { reasoning = "high" }


# Alternative selectors for the same models, if a provider is unavailable:
#   grok: prime-inference/x-ai/grok-4.6
#   sol:  openrouter/openai/gpt-5.6-sol, prime-inference/openai/gpt-5.6-sol
