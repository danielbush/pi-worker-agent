[project]
name = "prime-worker-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = [".", "tests"]
include = ["tools/**/*.py", "tests/**/*.py"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = [".", "tests"]
